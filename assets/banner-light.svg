<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="920" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="barGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="barGradL2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <pattern id="gridLight" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
  </defs>

  <style>
    .title { font: 800 34px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; fill: #0f172a; letter-spacing: -0.5px; }
    .subtitle { font: 700 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; fill: #0284c7; letter-spacing: 0.4px; }
    .desc { font: 400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; fill: #475569; }
    .mono { font: 500 12.5px 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: #1e293b; }
    .mono-kw { fill: #0284c7; font-weight: 700; }
    .mono-str { fill: #059669; }
    .card-title { font: 600 11px 'Segoe UI', sans-serif; fill: #64748b; text-transform: uppercase; letter-spacing: 0.8px; }
    .kpi-val { font: 700 20px 'Segoe UI', sans-serif; fill: #0f172a; }
    .kpi-tag { font: 600 11px 'Segoe UI', sans-serif; fill: #059669; }
    .cursor { animation: blink 1.1s step-end infinite; fill: #0284c7; font-weight: 700; }
    .bar-1 { transform-origin: bottom; animation: grow 1.2s ease-out forwards; }
    .bar-2 { transform-origin: bottom; animation: grow 1.4s ease-out forwards; }
    .bar-3 { transform-origin: bottom; animation: grow 1.6s ease-out forwards; }
    .bar-4 { transform-origin: bottom; animation: grow 1.8s ease-out forwards; }
    .bar-5 { transform-origin: bottom; animation: grow 2.0s ease-out forwards; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes grow { from { transform: scaleY(0.1); opacity: 0.2; } to { transform: scaleY(1); opacity: 1; } }
  </style>

  <!-- Main Card Background -->
  <rect width="920" height="260" rx="16" fill="url(#bgLight)" stroke="#cbd5e1" stroke-width="1.5" />
  <rect width="920" height="260" rx="16" fill="url(#gridLight)" opacity="0.7" />

  <!-- Top Status Pill -->
  <rect x="44" y="34" width="225" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="60" cy="47" r="4.5" fill="#10b981" />
  <text x="74" y="51" class="mono" style="font-size: 11px; fill: #334155;">Montpellier, FR · Open Source</text>

  <!-- Name & Role -->
  <text x="44" y="102" class="title">Jules Bataller</text>
  <text x="44" y="128" class="subtitle">DATA ANALYTICS · BUSINESS INTELLIGENCE · AUTOMATION</text>
  <text x="44" y="154" class="desc">Conception de tableaux de bord, modélisation SQL et automatisation de flux métiers.</text>

  <!-- Terminal SQL Prompt Box -->
  <rect x="44" y="176" width="505" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <circle cx="62" cy="200" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="76" cy="200" r="4.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="90" cy="200" r="4.5" fill="#10b981" opacity="0.8" />
  <text x="110" y="204" class="mono">
    <tspan class="mono-kw">SELECT</tspan> insight <tspan class="mono-kw">FROM</tspan> business_data <tspan class="mono-kw">WHERE</tspan> signal &gt; noise;<tspan class="cursor">_</tspan>
  </text>

  <!-- Right Side: Mini Analytics Bento Card -->
  <rect x="585" y="34" width="295" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="605" y="58" class="card-title">Pipeline &amp; BI Metrics</text>
  <text x="605" y="84" class="kpi-val">SQL · Metabase · R</text>
  <rect x="802" y="66" width="60" height="22" rx="6" fill="#d1fae5" />
  <text x="812" y="81" class="kpi-tag">ACTIVE</text>

  <!-- Animated Bar Chart inside Card -->
  <line x1="605" y1="196" x2="860" y2="196" stroke="#e2e8f0" stroke-width="1" />
  <rect x="618" y="148" width="28" height="48" rx="4" fill="url(#barGradL)" class="bar-1" />
  <rect x="662" y="102" width="28" height="94" rx="4" fill="url(#barGradL2)" class="bar-2" />
  <rect x="706" y="138" width="28" height="58" rx="4" fill="url(#barGradL)" class="bar-3" />
  <rect x="750" y="114" width="28" height="82" rx="4" fill="url(#barGradL2)" class="bar-4" />
  <rect x="794" y="144" width="28" height="52" rx="4" fill="url(#barGradL)" class="bar-5" />

  <!-- Trend Line Overlay -->
  <path d="M 632 144 L 676 98 L 720 134 L 764 110 L 808 140" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="632" cy="144" r="3.5" fill="#059669" />
  <circle cx="676" cy="98" r="4" fill="#059669" />
  <circle cx="720" cy="134" r="3.5" fill="#059669" />
  <circle cx="764" cy="110" r="3.5" fill="#059669" />
  <circle cx="808" cy="140" r="3.5" fill="#059669" />

  <text x="616" y="212" class="mono" style="font-size: 10px; fill: #64748b;">SQL</text>
  <text x="664" y="212" class="mono" style="font-size: 10px; fill: #64748b;">R</text>
  <text x="706" y="212" class="mono" style="font-size: 10px; fill: #64748b;">Py</text>
  <text x="748" y="212" class="mono" style="font-size: 10px; fill: #64748b;">ERP</text>
  <text x="795" y="212" class="mono" style="font-size: 10px; fill: #64748b;">BI</text>
</svg>

