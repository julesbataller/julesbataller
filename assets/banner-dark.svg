<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" />
    </pattern>
  </defs>

  <style>
    .title { font: 800 34px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
    .subtitle { font: 600 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; fill: #38bdf8; letter-spacing: 0.4px; }
    .desc { font: 400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; fill: #94a3b8; }
    .mono { font: 500 12.5px 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: #e2e8f0; }
    .mono-kw { fill: #38bdf8; font-weight: 700; }
    .mono-str { fill: #34d399; }
    .card-title { font: 600 11px 'Segoe UI', sans-serif; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; }
    .kpi-val { font: 700 20px 'Segoe UI', sans-serif; fill: #f8fafc; }
    .kpi-tag { font: 600 11px 'Segoe UI', sans-serif; fill: #34d399; }
    .cursor { animation: blink 1.1s step-end infinite; fill: #38bdf8; font-weight: 700; }
    .bar-1 { transform-origin: bottom; animation: grow 1.2s ease-out forwards; }
    .bar-2 { transform-origin: bottom; animation: grow 1.4s ease-out forwards; }
    .bar-3 { transform-origin: bottom; animation: grow 1.6s ease-out forwards; }
    .bar-4 { transform-origin: bottom; animation: grow 1.8s ease-out forwards; }
    .bar-5 { transform-origin: bottom; animation: grow 2.0s ease-out forwards; }
    .pulse { animation: pulseGlow 3s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes grow { from { transform: scaleY(0.1); opacity: 0.2; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.7; } }
  </style>

  <!-- Main Card Background -->
  <rect width="920" height="260" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" />
  <rect width="920" height="260" rx="16" fill="url(#grid)" opacity="0.55" />

  <!-- Subtle Glow Circles -->
  <circle cx="760" cy="60" r="110" fill="url(#accent)" opacity="0.12" class="pulse" />
  <circle cx="120" cy="220" r="90" fill="#38bdf8" opacity="0.07" />

  <!-- Top Status Pill -->
  <rect x="44" y="34" width="225" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="60" cy="47" r="4.5" fill="#34d399" class="pulse" />
  <text x="74" y="51" class="mono" style="font-size: 11px; fill: #cbd5e1;">Montpellier, FR · Open Source</text>

  <!-- Name & Role -->
  <text x="44" y="102" class="title">Jules Bataller</text>
  <text x="44" y="128" class="subtitle">DATA ANALYTICS · BUSINESS INTELLIGENCE · AUTOMATION</text>
  <text x="44" y="154" class="desc">Conception de tableaux de bord, modélisation SQL et automatisation de flux métiers.</text>

  <!-- Terminal SQL Prompt Box -->
  <rect x="44" y="176" width="505" height="48" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />
  <circle cx="62" cy="200" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="76" cy="200" r="4.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="90" cy="200" r="4.5" fill="#10b981" opacity="0.8" />
  <text x="110" y="204" class="mono">
    <tspan class="mono-kw">SELECT</tspan> insight <tspan class="mono-kw">FROM</tspan> business_data <tspan class="mono-kw">WHERE</tspan> signal &gt; noise;<tspan class="cursor">_</tspan>
  </text>

  <!-- Right Side: Mini Analytics Bento Card -->
  <rect x="585" y="34" width="295" height="190" rx="12" fill="#161b22" fill-opacity="0.85" stroke="#30363d" stroke-width="1.2" />
  <text x="605" y="58" class="card-title">Pipeline &amp; BI Metrics</text>
  <text x="605" y="84" class="kpi-val">SQL · Metabase · R</text>
  <rect x="802" y="66" width="60" height="22" rx="6" fill="#064e3b" />
  <text x="812" y="81" class="kpi-tag">ACTIVE</text>

  <!-- Animated Bar Chart inside Card -->
  <line x1="605" y1="196" x2="860" y2="196" stroke="#30363d" stroke-width="1" />
  <rect x="618" y="148" width="28" height="48" rx="4" fill="url(#barGrad)" class="bar-1" />
  <rect x="662" y="102" width="28" height="94" rx="4" fill="url(#barGrad2)" class="bar-2" />
  <rect x="706" y="138" width="28" height="58" rx="4" fill="url(#barGrad)" class="bar-3" />
  <rect x="750" y="114" width="28" height="82" rx="4" fill="url(#barGrad2)" class="bar-4" />
  <rect x="794" y="144" width="28" height="52" rx="4" fill="url(#barGrad)" class="bar-5" />

  <!-- Trend Line Overlay -->
  <path d="M 632 144 L 676 98 L 720 134 L 764 110 L 808 140" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="632" cy="144" r="3.5" fill="#34d399" />
  <circle cx="676" cy="98" r="4" fill="#34d399" />
  <circle cx="720" cy="134" r="3.5" fill="#34d399" />
  <circle cx="764" cy="110" r="3.5" fill="#34d399" />
  <circle cx="808" cy="140" r="3.5" fill="#34d399" />

  <text x="616" y="212" class="mono" style="font-size: 10px; fill: #64748b;">SQL</text>
  <text x="664" y="212" class="mono" style="font-size: 10px; fill: #64748b;">R</text>
  <text x="706" y="212" class="mono" style="font-size: 10px; fill: #64748b;">Py</text>
  <text x="748" y="212" class="mono" style="font-size: 10px; fill: #64748b;">ERP</text>
  <text x="795" y="212" class="mono" style="font-size: 10px; fill: #64748b;">BI</text>
</svg>

